name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Test Windows tray connection status
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installers/windows/Test-TrayConnectionState.ps1
      - name: Compile macOS menu bar
        if: runner.os == 'macOS'
        run: swiftc installers/macos/MemohMenuBar.swift -o "$RUNNER_TEMP/MemohMenuBar"
  adapters:
    strategy:
      matrix:
        adapter: [pi-acp, codex-acp]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
