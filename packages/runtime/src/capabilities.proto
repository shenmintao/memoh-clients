syntax = "proto3";

package memoh.runtime.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// Versioned JSON envelopes preserve MCP JSON schemas and content blocks.
// This service shares the authenticated Runtime connection; it opens no port.
service CapabilityService {
  rpc List(google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc Call(google.protobuf.StringValue) returns (google.protobuf.StringValue);
}
